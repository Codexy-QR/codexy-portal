<div class="table-wrapper">
	<table mat-table [dataSource]="dataSource" class="inventory-table">
		<!-- Columna de Código -->
		<ng-container matColumnDef="code">
			<th mat-header-cell *matHeaderCellDef>Código</th>
			<td mat-cell *matCellDef="let element" class="code-cell">
				<span class="code-badge">{{ element.code }}</span>
			</td>
		</ng-container>

		<!-- Columna de Nombre -->
		<ng-container matColumnDef="name">
			<th mat-header-cell *matHeaderCellDef>Nombre</th>
			<td mat-cell *matCellDef="let element" class="name-cell">
				<div class="item-details">
					<span class="item-name">{{ element.name }}</span>
					<span class="item-category">{{ (element.category | categoryInventoryBase).label }}</span>
				</div>
			</td>
		</ng-container>

		<!-- Columna de Descripción -->
		<ng-container matColumnDef="description">
			<th mat-header-cell *matHeaderCellDef>Descripción</th>
			<td mat-cell *matCellDef="let element" class="description-cell">
				<span class="item-description">{{ element.description }}</span>
			</td>
		</ng-container>

		<!-- Columna de Estado -->
		<ng-container matColumnDef="state">
			<th mat-header-cell *matHeaderCellDef> Estado </th>
			<td mat-cell *matCellDef="let element" class="state-cell">
				<span class="state-badge" [ngClass]="getStateClass(element.state)">
					{{ element.state }}
				</span>
			</td>
		</ng-container>

		<!-- Columna de Acciones -->
		<!-- Columna de Acciones -->
		<ng-container matColumnDef="actions">
			<th mat-header-cell *matHeaderCellDef>Acciones</th>
			<td mat-cell *matCellDef="let element" class="actions-cell">
				<button mat-icon-button color="primary" [matMenuTriggerFor]="actionMenu" aria-label="Acciones del item">
					<mat-icon>more_vert</mat-icon>
				</button>
				<mat-menu #actionMenu="matMenu">
					<button mat-menu-item (click)="onEditItem(element)">
						<mat-icon>edit</mat-icon>
						<span>Editar</span>
					</button>
					<button mat-menu-item (click)="onViewDetails(element)">
						<mat-icon>visibility</mat-icon>
						<span>Ver detalles</span>
					</button>
					<button mat-menu-item (click)="onDeleteItem(element)">
						<mat-icon>delete</mat-icon>
						<span>Eliminar</span>
					</button>
				</mat-menu>
			</td>
		</ng-container>

		<!-- Filas de la tabla -->
		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns;" class="inventory-row"></tr>

		<!-- Fila cuando no hay datos -->
		<tr class="mat-row no-data-row" *matNoDataRow>
			<td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
				<div class="no-data-content">
					<mat-icon>search_off</mat-icon>
					<p>No se encontraron items</p>
				</div>
			</td>
		</tr>
	</table>
</div>
